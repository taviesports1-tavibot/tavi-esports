name: Authorized Vercel routing metadata discovery

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/authorized-vercel-routing-metadata.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_cuSrhEI7TKd7G2EhByPHohqI
      VERCEL_PROJECT_ID: prj_BXNf82brdN8FK14GdsTb8AXIHAzg
    steps:
      - uses: actions/checkout@v4

      - name: Read routing variable names and IDs only
        shell: python
        run: |
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["VERCEL_TOKEN"]
          team = os.environ["VERCEL_TEAM_ID"]
          project = os.environ["VERCEL_PROJECT_ID"]
          params = urllib.parse.urlencode({"teamId": team})
          request = urllib.request.Request(
              f"https://api.vercel.com/v10/projects/{project}/env?{params}",
              headers={"Authorization": f"Bearer {token}"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          markers = ("SOURCE", "ORIGIN", "SITE", "UPSTREAM", "TARGET", "PROXY", "APP", "URL", "HOST", "BACKEND")
          entries = payload.get("envs", payload if isinstance(payload, list) else [])
          safe = []
          for entry in entries:
              key = entry.get("key", "")
              if any(marker in key.upper() for marker in markers):
                  safe.append({
                      "id": entry.get("id"),
                      "key": key,
                      "target": entry.get("target"),
                      "type": entry.get("type"),
                  })
          print("SANITIZED_ROUTING_METADATA=" + json.dumps(safe, separators=(",", ":"), sort_keys=True))
          if not safe:
              raise SystemExit(2)

      - name: Remove temporary PR and branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail --silent --show-error -o /dev/null -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER" -d '{"state":"closed"}'
          encoded_ref=$(python -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["HEAD_REF"], safe=""))')
          curl --fail --silent --show-error -o /dev/null -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/git/refs/heads/$encoded_ref"