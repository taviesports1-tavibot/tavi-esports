name: Authorized Vercel file metadata discovery

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/authorized-vercel-file-metadata.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_cuSrhEI7TKd7G2EhByPHohqI
      VERCEL_DEPLOYMENT_ID: dpl_9ALTp7wnBoBneNMuN2ZTmscLV4f6
    steps:
      - uses: actions/checkout@v4

      - name: List paths and types only
        shell: python
        run: |
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["VERCEL_TOKEN"]
          team = os.environ["VERCEL_TEAM_ID"]
          deployment = os.environ["VERCEL_DEPLOYMENT_ID"]
          params = urllib.parse.urlencode({"teamId": team})
          request = urllib.request.Request(
              f"https://api.vercel.com/v6/deployments/{deployment}/files?{params}",
              headers={"Authorization": f"Bearer {token}"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              tree = json.load(response)

          metadata = []
          def walk(nodes, prefix=""):
              for node in nodes if isinstance(nodes, list) else []:
                  name = node.get("name", "")
                  path = f"{prefix}/{name}" if prefix else name
                  metadata.append({"path": path, "type": node.get("type")})
                  walk(node.get("children", []), path)
          walk(tree)
          print("SANITIZED_FILE_METADATA=" + json.dumps(metadata, separators=(",", ":"), sort_keys=True))

      - name: Remove temporary PR and branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail --silent --show-error -o /dev/null -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER" -d '{"state":"closed"}'
          encoded_ref=$(python -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["HEAD_REF"], safe=""))')
          curl --fail --silent --show-error -o /dev/null -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/git/refs/heads/$encoded_ref"