name: Authorized Vercel project routing discovery

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/authorized-vercel-project-routing.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_cuSrhEI7TKd7G2EhByPHohqI
      VERCEL_PROJECT_ID: prj_BXNf82brdN8FK14GdsTb8AXIHAzg
    steps:
      - uses: actions/checkout@v4

      - name: Extract only public hosts and routing field paths
        shell: python
        run: |
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          token = os.environ["VERCEL_TOKEN"]
          team = os.environ["VERCEL_TEAM_ID"]
          project = os.environ["VERCEL_PROJECT_ID"]
          params = urllib.parse.urlencode({"teamId": team})
          request = urllib.request.Request(
              f"https://api.vercel.com/v9/projects/{project}?{params}",
              headers={"Authorization": f"Bearer {token}"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          host_pattern = re.compile(r"(?:https?://)?([a-z0-9.-]+\.(?:chatgpt\.site|vercel\.app))(?:/[^\"'\s\\]*)?", re.I)
          route_key = re.compile(r"route|rewrite|microfront|proxy|redirect|origin|upstream|target|destination", re.I)
          hosts = set()
          routing_paths = set()

          def walk(value, path="root"):
              if isinstance(value, dict):
                  for key, item in value.items():
                      child = f"{path}.{key}"
                      if route_key.search(key):
                          routing_paths.add(child)
                      walk(item, child)
              elif isinstance(value, list):
                  for index, item in enumerate(value):
                      walk(item, f"{path}[{index}]")
              elif isinstance(value, str):
                  hosts.update(match.lower() for match in host_pattern.findall(value))

          walk(payload)
          result = {"public_hosts": sorted(hosts), "routing_field_paths": sorted(routing_paths)}
          print("PROJECT_ROUTING_RESULT=" + json.dumps(result, separators=(",", ":"), sort_keys=True))

      - name: Remove temporary PR and branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail --silent --show-error -o /dev/null -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER" -d '{"state":"closed"}'
          encoded_ref=$(python -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["HEAD_REF"], safe=""))')
          curl --fail --silent --show-error -o /dev/null -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/git/refs/heads/$encoded_ref"