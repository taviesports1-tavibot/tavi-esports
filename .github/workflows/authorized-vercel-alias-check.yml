name: Authorized Vercel alias check

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/authorized-vercel-alias-check.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_cuSrhEI7TKd7G2EhByPHohqI
    steps:
      - uses: actions/checkout@v4

      - name: Read alias target metadata only
        shell: python
        run: |
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["VERCEL_TOKEN"]
          team = os.environ["VERCEL_TEAM_ID"]
          params = urllib.parse.urlencode({"teamId": team})
          request = urllib.request.Request(
              f"https://api.vercel.com/v4/aliases/www.tavi-esports.com?{params}",
              headers={"Authorization": f"Bearer {token}"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          result = {
              "alias": payload.get("alias"),
              "deploymentId": payload.get("deploymentId"),
              "projectId": payload.get("projectId"),
              "redirect": payload.get("redirect"),
              "deployment_url": (payload.get("deployment") or {}).get("url"),
          }
          print("SANITIZED_ALIAS_RESULT=" + json.dumps(result, separators=(",", ":"), sort_keys=True))

      - name: Remove temporary PR and branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail --silent --show-error -o /dev/null -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER" -d '{"state":"closed"}'
          encoded_ref=$(python -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["HEAD_REF"], safe=""))')
          curl --fail --silent --show-error -o /dev/null -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/git/refs/heads/$encoded_ref"