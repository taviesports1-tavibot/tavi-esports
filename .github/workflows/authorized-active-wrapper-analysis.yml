name: Authorized active wrapper analysis

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/authorized-active-wrapper-analysis.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_cuSrhEI7TKd7G2EhByPHohqI
      VERCEL_DEPLOYMENT_ID: dpl_3JLgLDAgwWHFKdWw2cSCvDkGWQEf
    steps:
      - uses: actions/checkout@v4

      - name: Summarize wrapper routes without outputting source
        shell: python
        run: |
          import base64
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          token = os.environ["VERCEL_TOKEN"]
          team = os.environ["VERCEL_TEAM_ID"]
          deployment = os.environ["VERCEL_DEPLOYMENT_ID"]
          headers = {"Authorization": f"Bearer {token}"}

          def api(path):
              separator = "&" if "?" in path else "?"
              request = urllib.request.Request(
                  "https://api.vercel.com" + path + separator + urllib.parse.urlencode({"teamId": team}),
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          files = []
          def walk(nodes, prefix=""):
              for node in nodes if isinstance(nodes, list) else []:
                  name = node.get("name", "")
                  path = f"{prefix}/{name}" if prefix else name
                  if node.get("type") == "file" and node.get("uid"):
                      files.append((path, node["uid"]))
                  walk(node.get("children", []), path)
          walk(api(f"/v6/deployments/{deployment}/files"))

          hosts = set()
          env_keys = set()
          flags = {word: False for word in ("rewrites", "redirects", "proxy", "destination", "source")}
          for path, uid in files:
              if path.endswith("package-lock.json"):
                  continue
              try:
                  payload = api(f"/v8/deployments/{deployment}/files/{uid}")
                  text = base64.b64decode(payload.get("content", ""), validate=False).decode("utf-8", errors="ignore")
              except Exception:
                  continue
              hosts.update(match.lower() for match in re.findall(r"https?://([A-Za-z0-9.-]+)", text))
              env_keys.update(re.findall(r"process\.env\.([A-Z][A-Z0-9_]{2,})", text))
              env_keys.update(re.findall(r"process\.env\[['\"]([A-Z][A-Z0-9_]{2,})['\"]\]", text))
              for word in flags:
                  flags[word] = flags[word] or bool(re.search(rf"\b{word}\b", text, re.I))

          result = {
              "source_paths": sorted(path for path, _ in files),
              "url_hosts": sorted(hosts),
              "env_key_names": sorted(env_keys),
              "routing_flags": flags,
          }
          print("ACTIVE_WRAPPER_ANALYSIS=" + json.dumps(result, separators=(",", ":"), sort_keys=True))

      - name: Remove temporary PR and branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail --silent --show-error -o /dev/null -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER" -d '{"state":"closed"}'
          encoded_ref=$(python -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["HEAD_REF"], safe=""))')
          curl --fail --silent --show-error -o /dev/null -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/git/refs/heads/$encoded_ref"