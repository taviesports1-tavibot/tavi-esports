name: Diagnose TaVi public routing

on:
  push:
    branches:
      - agent/diagnose-logo-storage
    paths:
      - .github/workflows/diagnose-public-routing.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public DNS and response headers only
        shell: bash
        run: |
          echo "DNS_APEX_A"
          dig +short A tavi-esports.com
          echo "DNS_APEX_CNAME"
          dig +short CNAME tavi-esports.com
          echo "DNS_WWW_A"
          dig +short A www.tavi-esports.com
          echo "DNS_WWW_CNAME"
          dig +short CNAME www.tavi-esports.com
          echo "PUBLIC_HEADERS"
          curl --silent --show-error --location --head --max-redirs 5 https://www.tavi-esports.com/ | sed -E '/^(set-cookie|cookie|authorization|x-vercel-protection-bypass):/Id'
          echo "PUBLIC_HEALTH"
          curl --silent --show-error --max-time 15 https://www.tavi-esports.com/api/health
