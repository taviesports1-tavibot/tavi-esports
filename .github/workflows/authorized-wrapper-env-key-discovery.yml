name: Authorized wrapper environment key discovery

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/authorized-wrapper-env-key-discovery.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_cuSrhEI7TKd7G2EhByPHohqI
      VERCEL_DEPLOYMENT_ID: dpl_9ALTp7wnBoBneNMuN2ZTmscLV4f6
    steps:
      - uses: actions/checkout@v4

      - name: Discover environment key names only
        shell: python
        run: |
          import base64
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          token = os.environ["VERCEL_TOKEN"]
          team = os.environ["VERCEL_TEAM_ID"]
          deployment = os.environ["VERCEL_DEPLOYMENT_ID"]
          headers = {"Authorization": f"Bearer {token}"}

          def api(path):
              separator = "&" if "?" in path else "?"
              request = urllib.request.Request(
                  "https://api.vercel.com" + path + separator + urllib.parse.urlencode({"teamId": team}),
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def flatten(nodes):
              output = []
              for node in nodes if isinstance(nodes, list) else []:
                  if node.get("type") == "file" and node.get("uid"):
                      output.append((node.get("name", ""), node["uid"]))
                  output.extend(flatten(node.get("children", [])))
              return output

          files = flatten(api(f"/v6/deployments/{deployment}/files"))
          allowed = re.compile(r"(?:^|\.)(?:js|mjs|cjs|json|ts|tsx)$", re.I)
          patterns = [
              re.compile(r"process\.env\.([A-Z][A-Z0-9_]{2,})"),
              re.compile(r"process\.env\[['\"]([A-Z][A-Z0-9_]{2,})['\"]\]"),
          ]
          keys = set()
          for name, uid in files[:800]:
              if not allowed.search(name):
                  continue
              try:
                  payload = api(f"/v8/deployments/{deployment}/files/{uid}")
                  text = base64.b64decode(payload.get("content", ""), validate=False).decode("utf-8", errors="ignore")
              except Exception:
                  continue
              for pattern in patterns:
                  keys.update(pattern.findall(text))

          safe_keys = sorted(key for key in keys if not any(
              marker in key for marker in ("TOKEN", "SECRET", "PASSWORD", "DATABASE", "POSTGRES", "AUTH", "KEY")
          ))
          print("SANITIZED_ENV_KEYS=" + json.dumps(safe_keys, separators=(",", ":")))
          if not safe_keys:
              raise SystemExit(2)

      - name: Remove temporary PR and branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail --silent --show-error -o /dev/null -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER" -d '{"state":"closed"}'
          encoded_ref=$(python -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["HEAD_REF"], safe=""))')
          curl --fail --silent --show-error -o /dev/null -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/git/refs/heads/$encoded_ref"