name: Emergency rollback TaVi Esports production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emergency-tavi-rollback
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_BXNf82brdN8FK14GdsTb8AXIHAzg
      VERCEL_TEAM_ID: team_cuSrhEI7TKd7G2EhByPHohqI
      ROLLBACK_DEPLOYMENT_ID: dpl_3JLgLDAgwWHFKdWw2cSCvDkGWQEf
    steps:
      - name: Point production back to the last working deployment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "::error::VERCEL_TOKEN secret is missing"; exit 1; }
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/rollback/$ROLLBACK_DEPLOYMENT_ID?teamId=$VERCEL_TEAM_ID&description=Emergency%20rollback%20to%20last%20working%20TaVi%20Esports%20deployment"
          echo "Rolled production back to $ROLLBACK_DEPLOYMENT_ID" >> "$GITHUB_STEP_SUMMARY"
